name: Android NDK Build

on:
  workflow_dispatch:
    
  pull_request:
    branches: [ dev, release, actionsTest ]
  push:
    branches: [ actionsTest, '*ndk*' ]

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: 'x86'
            abi: 'x86'
            android_abi: 'x86'
          - name: 'armeabi-v7a'
            abi: 'armeabi-v7a'
            android_abi: 'armeabi-v7a'
          - name: 'arm64-v8a'
            abi: 'arm64-v8a'
            android_abi: 'arm64-v8a'

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # tag=v6.0.2

    - name: Set up JDK 17
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@651bceb6f9ca583f16b8d75b62c36ded2ae6fc9c # v4.0.0

    - name: Build with CMake and NDK
      run: |
        mkdir -p build-android
        cd build-android
        cmake --version
        cmake ../build/cmake \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=${{ matrix.arch.android_abi }} \
          -DANDROID_PLATFORM=android-28 \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build . --parallel
        
    - name: finding .so and .a
      run: |
       find . -name "*.so"
       find . -name "*.a"
       
    - name: uploading artifact ${{ matrix.arch.name }}
      if: success()
      uses: actions/upload-artifact@v7.0.1
      with:
          name: android-${{ matrix.arch.abi }}-artifacts
          path: |
            ./build-android/lib/libzstd.so
            ./build-android/lib/libzstd.a
